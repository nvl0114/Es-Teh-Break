<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>印尼語詞彙 | Es Teh Break</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: #fff8ef;
            color: #5c4033;
        }

        body {
            font-family: Arial, "Noto Sans TC", sans-serif;
        }

        /* Shared sidebar / navigation */
        #app {
            margin: 0;
            padding: 0;
        }

        /*
         * Vocabulary page
         * Jangan kasih margin-top besar karena #app
         * sudah menangani navigation/sidebar.
         */
        .vocab-page {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 0 20px 50px;
        }

        .page-header {
            text-align: center;
            margin: 0 0 16px;
            padding: 0;
        }

        .page-header h1 {
            margin: 0 0 8px;
            font-size: 28px;
            color: #5c4033;
        }

        .page-header p {
            margin: 0;
            font-size: 14px;
            line-height: 1.7;
            color: #7a6254;
        }

        /* Search */
        .search-box {
            display: flex;
            align-items: center;
            gap: 10px;

            background: #ffffff;
            border: 1px solid #ead9c8;
            border-radius: 14px;

            padding: 11px 14px;
            margin: 0 0 12px;

            box-shadow: 0 3px 10px rgba(92, 64, 51, 0.05);
        }

        .search-box i {
            color: #b8865c;
        }

        .search-box input {
            width: 100%;
            border: none;
            outline: none;

            background: transparent;
            color: #5c4033;

            font-size: 14px;
        }

        .search-box input::placeholder {
            color: #b7a397;
        }

        /* Result */
        .result-info {
            margin: 0 0 10px;
            font-size: 13px;
            color: #8a7263;
        }

        /* Vocabulary list */
        .vocab-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .vocab-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;

            background: #ffffff;
            border: 1px solid #ead9c8;
            border-radius: 14px;

            padding: 13px 14px;

            box-shadow: 0 3px 10px rgba(92, 64, 51, 0.04);
        }

        .vocab-info {
            min-width: 0;
        }

        .indonesia-word {
            font-size: 17px;
            font-weight: 700;
            color: #5c4033;
            margin-bottom: 4px;
        }

        .mandarin-word {
            font-size: 14px;
            color: #9b7457;
        }

        .audio-btn {
            flex-shrink: 0;

            width: 40px;
            height: 40px;

            border: none;
            border-radius: 50%;

            background: #b8865c;
            color: white;

            cursor: pointer;
            font-size: 15px;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .audio-btn:active {
            transform: scale(0.94);
        }

        /* No result */
        .no-result {
            display: none;

            text-align: center;
            padding: 35px 20px;
            color: #8a7263;
        }

        .no-result-icon {
            font-size: 35px;
            margin-bottom: 10px;
        }

        .no-result strong {
            display: block;
            margin-bottom: 5px;
        }

        .no-result p {
            margin: 0;
            font-size: 13px;
        }

        /* Mobile */
        @media (max-width: 600px) {

            .vocab-page {
                padding: 0 12px 40px;
            }

            .page-header {
                margin-bottom: 13px;
            }

            .page-header h1 {
                font-size: 24px;
            }

            .page-header p {
                font-size: 13px;
            }

            .vocab-card {
                padding: 12px;
            }

            .indonesia-word {
                font-size: 16px;
            }

            .mandarin-word {
                font-size: 13px;
            }

            .audio-btn {
                width: 38px;
                height: 38px;
            }
        }
    </style>
</head>

<body>

    <!-- Shared sidebar / navigation -->
    <div id="app"></div>

    <!-- Vocabulary content -->
    <main class="vocab-page">

        <div class="page-header">
            <h1>📚 印尼語詞彙</h1>

            <p>
                學習常用的印尼語詞彙，
                搭配繁體中文解釋，幫助你更輕鬆地學習印尼語。
            </p>
        </div>

        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>

            <input
                type="text"
                id="searchInput"
                placeholder="搜尋印尼語或中文..."
                autocomplete="off"
            >
        </div>

        <div class="result-info">
            <span id="resultCount"></span>
        </div>

        <div id="vocabList" class="vocab-list"></div>

        <div id="noResult" class="no-result">
            <div class="no-result-icon">🔍</div>

            <strong>找不到相關詞彙</strong>

            <p>請試試其他關鍵字。</p>
        </div>

    </main>

    <script>
        const vocabulary = [
            { indonesia: "Hai", mandarin: "嗨" },
            { indonesia: "Halo", mandarin: "你好" },
            { indonesia: "Selamat pagi", mandarin: "早安" },
            { indonesia: "Selamat siang", mandarin: "午安" },
            { indonesia: "Selamat sore", mandarin: "下午好" },
            { indonesia: "Selamat malam", mandarin: "晚安" },

            { indonesia: "Pagi", mandarin: "早上" },
            { indonesia: "Siang", mandarin: "中午" },
            { indonesia: "Sore", mandarin: "下午" },
            { indonesia: "Malam", mandarin: "晚上" },

            { indonesia: "Terima kasih", mandarin: "謝謝" },
            { indonesia: "Makasih", mandarin: "謝謝" },
            { indonesia: "Permisi", mandarin: "不好意思" },
            { indonesia: "Maaf", mandarin: "對不起" },

            {
                indonesia: "Senang bertemu dengan Anda",
                mandarin: "很高興認識你"
            },

            {
                indonesia: "Salam kenal",
                mandarin: "很高興認識你"
            },

            { indonesia: "Apa kabar", mandarin: "你好嗎？" },
            { indonesia: "Gimana kabar", mandarin: "最近好嗎？" },

            { indonesia: "Aku", mandarin: "我" },
            { indonesia: "Kamu", mandarin: "你" },
            { indonesia: "Nama", mandarin: "名字" },
            { indonesia: "Orang", mandarin: "人" },
            { indonesia: "Mana", mandarin: "哪裡" },
            { indonesia: "Adalah", mandarin: "是" },

            { indonesia: "Duluan", mandarin: "先走" },
            { indonesia: "Hati-hati", mandarin: "小心" },
            { indonesia: "Dadah", mandarin: "掰掰" },
            { indonesia: "Sampai jumpa", mandarin: "再見" }
        ];

        const vocabList = document.getElementById("vocabList");
        const searchInput = document.getElementById("searchInput");
        const resultCount = document.getElementById("resultCount");
        const noResult = document.getElementById("noResult");

        function speak(text) {
            if (!("speechSynthesis" in window)) return;

            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = "id-ID";
            utterance.rate = 0.85;

            window.speechSynthesis.speak(utterance);
        }

        function displayVocabulary(list) {

            vocabList.innerHTML = "";

            resultCount.textContent = `${list.length} 個詞彙`;

            if (list.length === 0) {
                noResult.style.display = "block";
                return;
            }

            noResult.style.display = "none";

            list.forEach(word => {

                const card = document.createElement("div");
                card.className = "vocab-card";

                card.innerHTML = `
                    <div class="vocab-info">
                        <div class="indonesia-word">
                            ${word.indonesia}
                        </div>

                        <div class="mandarin-word">
                            ${word.mandarin}
                        </div>
                    </div>

                    <button
                        class="audio-btn"
                        aria-label="播放 ${word.indonesia}"
                    >
                        <i class="fa-solid fa-volume-high"></i>
                    </button>
                `;

                const audioButton = card.querySelector(".audio-btn");

                audioButton.addEventListener("click", () => {
                    speak(word.indonesia);
                });

                vocabList.appendChild(card);
            });
        }

        searchInput.addEventListener("input", function () {

            const keyword = this.value
                .trim()
                .toLowerCase();

            const filtered = vocabulary.filter(word =>
                word.indonesia.toLowerCase().includes(keyword) ||
                word.mandarin.toLowerCase().includes(keyword)
            );

            displayVocabulary(filtered);
        });

        displayVocabulary(vocabulary);
    </script>

    <!-- Shared script -->
    <script src="script.js"></script>

</body>
</html>
