<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Es Teh Break</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>

        /* =========================================
           BASIC
        ========================================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Noto Sans TC",
                sans-serif;

            background: #fff8ef;
            color: #5c4033;
            min-height: 100vh;
        }


        /* =========================================
           LAYOUT
        ========================================= */

        .site-layout {
            display: flex;
            min-height: 100vh;
        }


        /* =========================================
           SIDEBAR
        ========================================= */

        .sidebar {
            width: 250px;
            min-height: 100vh;

            background: #fffdf9;

            border-right: 1px solid #eaded2;

            padding: 28px 18px;

            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;

            overflow-y: auto;

            z-index: 1000;
        }


        /* =========================================
           LOGO
        ========================================= */

        .logo-area {
            text-align: center;
            padding: 5px 5px 25px;
        }

        .logo-img {
            width: 105px;
            height: 105px;

            object-fit: contain;

            display: block;
            margin: 0 auto 10px;
        }

        .logo-title {
            font-size: 22px;
            font-weight: 800;
            color: #7b5137;

            letter-spacing: 0.3px;
        }

        .logo-subtitle {
            margin-top: 6px;

            font-size: 13px;
            line-height: 1.6;

            color: #9b7a65;
        }


        /* =========================================
           LITTLE ICE TEA DECORATION
        ========================================== */

        .tea-decoration {
            margin: 0 auto 22px;

            width: fit-content;

            background: #fff3e5;

            border: 1px solid #f0dfcf;

            border-radius: 999px;

            padding: 7px 14px;

            font-size: 14px;

            box-shadow: 0 3px 10px rgba(92, 64, 51, 0.05);
        }


        /* =========================================
           NAVIGATION
        ========================================== */

        .nav-title {
            font-size: 12px;
            font-weight: 700;

            color: #b0937e;

            margin: 0 10px 9px;

            letter-spacing: 0.5px;
        }

        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;

            text-decoration: none;

            color: #725847;

            padding: 11px 13px;

            border-radius: 12px;

            font-size: 14px;
            font-weight: 600;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }

        .nav-item i {
            width: 20px;

            text-align: center;

            font-size: 15px;

            color: #a87958;
        }

        .nav-item:hover {
            background: #fff2e5;

            transform: translateX(2px);
        }

        .nav-item.active {
            background: #f4dfcd;

            color: #654533;
        }

        .nav-item.active i {
            color: #80553a;
        }


        /* =========================================
           SIDEBAR BOTTOM MESSAGE
        ========================================== */

        .sidebar-message {
            margin-top: 28px;

            padding: 15px 14px;

            background: #fff6ec;

            border: 1px solid #f0dfcf;

            border-radius: 16px;

            text-align: center;
        }

        .sidebar-message .emoji {
            font-size: 23px;
            margin-bottom: 7px;
        }

        .sidebar-message p {
            font-size: 13px;
            line-height: 1.7;

            color: #795c49;
        }


        /* =========================================
           MAIN CONTENT
        ========================================== */

        .main {
            width: calc(100% - 250px);

            margin-left: 250px;

            padding: 45px 30px 70px;
        }

        .content-wrapper {
            width: 100%;
            max-width: 820px;

            margin: 0 auto;
        }


        /* =========================================
           PAGE HEADER
        ========================================== */

        .page-header {
            text-align: center;

            margin-bottom: 30px;
        }

        .page-header .small-emoji {
            font-size: 25px;

            margin-bottom: 8px;
        }

        .page-header h1 {
            font-size: 30px;

            color: #674633;

            margin-bottom: 9px;
        }

        .page-header p {
            font-size: 15px;

            color: #947865;

            line-height: 1.8;
        }


        /* =========================================
           EMPTY CONTENT AREA
        ========================================== */

        .page-card {
            background: #ffffff;

            border: 1px solid #eaded2;

            border-radius: 20px;

            padding: 30px;

            box-shadow:
                0 8px 25px rgba(92, 64, 51, 0.06);
        }


        /* =========================================
           SAMPLE SECTION
           Nanti bisa dihapus dari template
        ========================================== */

        .section-title {
            display: flex;
            align-items: center;
            gap: 9px;

            font-size: 20px;

            color: #704a35;

            margin-bottom: 12px;
        }

        .section-description {
            font-size: 14px;

            color: #8f7462;

            line-height: 1.8;

            margin-bottom: 20px;
        }


        /* =========================================
           SAMPLE BUTTON
        ========================================== */

        .cute-button {
            border: none;

            background: #b8865c;
            color: white;

            padding: 11px 19px;

            border-radius: 12px;

            font-size: 14px;
            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                opacity 0.2s ease;
        }

        .cute-button:hover {
            transform: translateY(-1px);
            opacity: 0.9;
        }


        /* =========================================
           MOBILE MENU
        ========================================== */

        .mobile-menu {
            display: none;

            position: fixed;

            top: 15px;
            left: 15px;

            width: 44px;
            height: 44px;

            border: none;

            border-radius: 13px;

            background: #ffffff;

            color: #704a35;

            box-shadow:
                0 5px 18px rgba(92, 64, 51, 0.12);

            font-size: 18px;

            cursor: pointer;

            z-index: 2000;
        }


        /* =========================================
           MOBILE
        ========================================== */

        @media (max-width: 768px) {

            .sidebar {
                width: 245px;

                transform: translateX(-100%);

                transition: transform 0.25s ease;

                box-shadow:
                    5px 0 25px rgba(92, 64, 51, 0.12);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .mobile-menu {
                display: block;
            }

            .main {
                width: 100%;

                margin-left: 0;

                padding:
                    75px
                    18px
                    50px;
            }

            .page-header h1 {
                font-size: 25px;
            }

            .page-card {
                padding: 22px 18px;

                border-radius: 17px;
            }
        }


        /* =========================================
           VERY SMALL SCREEN
        ========================================== */

        @media (max-width: 400px) {

            .main {
                padding-left: 14px;
                padding-right: 14px;
            }

            .page-header h1 {
                font-size: 23px;
            }

            .page-header p {
                font-size: 14px;
            }
        }

    </style>
</head>


<body>

<div class="site-layout">


    <!-- =========================================
         SIDEBAR
    ========================================== -->

    <aside class="sidebar" id="sidebar">

        <div class="logo-area">

            <img
                src="logo.png"
                alt="Es Teh Break"
                class="logo-img"
            >

            <div class="logo-title">
                Es Teh Break
            </div>

            <div class="logo-subtitle">
                輕鬆學印尼文
            </div>

        </div>


        <div class="tea-decoration">
            🧊🍵 一起學印尼文吧！
        </div>


        <div class="nav-title">
            MENU
        </div>


        <nav class="sidebar-nav">

            <a href="index.html" class="nav-item active">
                <i class="fa-solid fa-house"></i>
                <span>首頁</span>
            </a>

            <a href="lessons.html" class="nav-item">
                <i class="fa-solid fa-book-open"></i>
                <span>開始學習</span>
            </a>

            <a href="phrases.html" class="nav-item">
                <i class="fa-solid fa-comment-dots"></i>
                <span>日常用語</span>
            </a>

            <a href="survival.html" class="nav-item">
                <i class="fa-solid fa-suitcase"></i>
                <span>生活必備</span>
            </a>

            <a href="listening.html" class="nav-item">
                <i class="fa-solid fa-headphones"></i>
                <span>聽力練習</span>
            </a>

            <a href="about.html" class="nav-item">
                <i class="fa-solid fa-circle-info"></i>
                <span>關於這裡</span>
            </a>

        </nav>


        <div class="sidebar-message">

            <div class="emoji">
                🧊🍵
            </div>

            <p>
                不用急，慢慢學就好。
            </p>

            <p>
                今天學一點點也很棒！
            </p>

        </div>

    </aside>



    <!-- =========================================
         MAIN
    ========================================== -->

    <main class="main">

        <div class="content-wrapper">


            <!-- PAGE HEADER -->

            <header class="page-header">

                <div class="small-emoji">
                    🧊🍵
                </div>

                <h1>
                    歡迎來到 Es Teh Break！
                </h1>

                <p>
                    輕鬆學印尼文，從日常生活開始。
                </p>

            </header>



            <!-- CONTENT CARD -->

            <section class="page-card">

                <h2 class="section-title">
                    🧊 今天想學什麼？
                </h2>

                <p class="section-description">
                    這裡會放每個頁面的內容。
                    你可以慢慢學，不用一次學很多。
                </p>

                <button class="cute-button">
                    開始學習
                </button>

            </section>


        </div>

    </main>

</div>



<!-- MOBILE MENU -->

<button
    class="mobile-menu"
    id="mobile-menu"
    aria-label="開啟選單">

    <i class="fa-solid fa-bars"></i>

</button>



<script>

    /* =========================================
       MOBILE SIDEBAR
    ========================================== */

    const menuButton =
        document.getElementById("mobile-menu");

    const sidebar =
        document.getElementById("sidebar");


    menuButton.addEventListener("click", function () {

        sidebar.classList.toggle("open");

    });


    /* =========================================
       CLOSE SIDEBAR AFTER CLICKING A LINK
    ========================================== */

    const navLinks =
        document.querySelectorAll(".nav-item");


    navLinks.forEach(function (link) {

        link.addEventListener("click", function () {

            if (window.innerWidth <= 768) {

                sidebar.classList.remove("open");

            }

        });

    });

</script>

</body>
</html>
