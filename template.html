<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Es Teh Break</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>

        /* =========================================
           BASIC
        ========================================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Noto Sans TC",
                sans-serif;

            background: #fff8ef;
            color: #5c4033;

            min-height: 100vh;
        }


        /* =========================================
           TOP BAR
        ========================================= */

        .topbar {
            width: 100%;
            height: 72px;

            background: #fffdf9;

            border-bottom: 1px solid #eaded2;

            display: flex;
            align-items: center;

            padding: 0 22px;

            position: fixed;
            top: 0;
            left: 0;

            z-index: 1000;

            box-shadow:
                0 3px 15px rgba(92, 64, 51, 0.05);
        }


        /* =========================================
           MENU BUTTON
        ========================================= */

        .menu-button {
            width: 43px;
            height: 43px;

            border: none;

            border-radius: 12px;

            background: #fff2e5;

            color: #76513d;

            font-size: 18px;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            transition: 0.2s ease;
        }

        .menu-button:hover {
            background: #f4dfcd;

            transform: translateY(-1px);
        }


        /* =========================================
           LOGO AREA
        ========================================= */

        .top-logo {
            display: flex;
            align-items: center;

            margin-left: 15px;

            gap: 10px;
        }

        .top-logo img {
            width: 43px;
            height: 43px;

            object-fit: contain;
        }

        .brand-name {
            font-size: 19px;
            font-weight: 800;

            color: #704a35;
        }

        .brand-subtitle {
            font-size: 11px;

            color: #a08370;

            margin-top: 2px;
        }


        /* =========================================
           TOP DECORATION
        ========================================= */

        .tea-emoji {
            margin-left: auto;

            font-size: 21px;
        }


        /* =========================================
           SIDEBAR / MENU PANEL
        ========================================= */

        .sidebar {
            position: fixed;

            top: 72px;
            left: 0;

            width: 270px;

            height: calc(100vh - 72px);

            background: #fffdf9;

            border-right: 1px solid #eaded2;

            padding: 25px 18px;

            transform: translateX(-100%);

            transition:
                transform 0.25s ease;

            z-index: 999;

            overflow-y: auto;

            box-shadow:
                7px 0 25px rgba(92, 64, 51, 0.08);
        }

        .sidebar.open {
            transform: translateX(0);
        }


        /* =========================================
           SIDEBAR INTRO
        ========================================= */

        .sidebar-intro {
            text-align: center;

            padding: 5px 10px 22px;
        }

        .sidebar-intro img {
            width: 85px;
            height: 85px;

            object-fit: contain;

            margin-bottom: 8px;
        }

        .sidebar-intro h2 {
            font-size: 18px;

            color: #704a35;
        }

        .sidebar-intro p {
            margin-top: 5px;

            font-size: 13px;

            color: #9b7a65;

            line-height: 1.6;
        }


        /* =========================================
           MENU TITLE
        ========================================= */

        .menu-title {
            font-size: 11px;

            color: #b0937e;

            font-weight: 700;

            letter-spacing: 1px;

            margin:
                5px 10px
                9px;
        }


        /* =========================================
           NAVIGATION
        ========================================= */

        .sidebar-nav {
            display: flex;

            flex-direction: column;

            gap: 5px;
        }

        .nav-item {
            display: flex;

            align-items: center;

            gap: 13px;

            padding: 12px 13px;

            border-radius: 12px;

            text-decoration: none;

            color: #725847;

            font-size: 14px;

            font-weight: 600;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }

        .nav-item i {
            width: 20px;

            text-align: center;

            color: #a87958;
        }

        .nav-item:hover {
            background: #fff2e5;

            transform: translateX(2px);
        }

        .nav-item.active {
            background: #f4dfcd;

            color: #654533;
        }


        /* =========================================
           SIDEBAR MESSAGE
        ========================================= */

        .sidebar-message {
            margin-top: 25px;

            padding: 14px;

            border-radius: 15px;

            background: #fff6ec;

            border: 1px solid #f0dfcf;

            text-align: center;
        }

        .sidebar-message .emoji {
            font-size: 21px;

            margin-bottom: 6px;
        }

        .sidebar-message p {
            font-size: 12px;

            line-height: 1.7;

            color: #806553;
        }


        /* =========================================
           DARK OVERLAY
        ========================================= */

        .overlay {
            position: fixed;

            inset: 0;

            background: rgba(60, 40, 30, 0.18);

            opacity: 0;

            visibility: hidden;

            transition: 0.25s ease;

            z-index: 998;
        }

        .overlay.show {
            opacity: 1;

            visibility: visible;
        }


        /* =========================================
           MAIN CONTENT
        ========================================= */

        .main {
            min-height: 100vh;

            padding:
                105px
                25px
                60px;
        }

        .content {
            width: 100%;

            max-width: 820px;

            margin: 0 auto;
        }


        /* =========================================
           TEMPLATE CONTENT AREA
           
           Kosong.
           HTML lain akan memasukkan isi
           halaman mereka ke sini.
        ========================================= */

        #page-content {
            width: 100%;
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 600px) {

            .topbar {
                height: 64px;

                padding: 0 14px;
            }

            .sidebar {
                top: 64px;

                height: calc(100vh - 64px);

                width: 255px;
            }

            .main {
                padding:
                    88px
                    16px
                    45px;
            }

            .brand-name {
                font-size: 17px;
            }

            .brand-subtitle {
                display: none;
            }

            .top-logo {
                margin-left: 10px;
            }

            .top-logo img {
                width: 39px;
                height: 39px;
            }

            .tea-emoji {
                font-size: 18px;
            }
        }

    </style>
</head>


<body>


    <!-- =========================================
         TOP BAR
    ========================================== -->

    <header class="topbar">

        <button
            class="menu-button"
            id="menuButton"
            aria-label="開啟選單"
            aria-expanded="false">

            <i class="fa-solid fa-bars"></i>

        </button>


        <div class="top-logo">

            <img
                src="logo.png"
                alt="Es Teh Break">

            <div>
                <div class="brand-name">
                    Es Teh Break
                </div>

                <div class="brand-subtitle">
                    輕鬆學印尼文
                </div>
            </div>

        </div>


        <div class="tea-emoji">
            🧊🍵
        </div>

    </header>



    <!-- =========================================
         SIDEBAR
    ========================================== -->

    <aside
        class="sidebar"
        id="sidebar">


        <div class="sidebar-intro">

            <img
                src="logo.png"
                alt="Es Teh Break">

            <h2>
                Es Teh Break
            </h2>

            <p>
                🧊🍵 輕鬆學印尼文
            </p>

        </div>


        <div class="menu-title">
            MENU
        </div>


        <nav class="sidebar-nav">

            <a
                href="index.html"
                class="nav-item">

                <i class="fa-solid fa-house"></i>

                <span>
                    首頁
                </span>

            </a>


            <a
                href="lessons.html"
                class="nav-item">

                <i class="fa-solid fa-book-open"></i>

                <span>
                    開始學習
                </span>

            </a>


            <a
                href="phrases.html"
                class="nav-item">

                <i class="fa-solid fa-comment-dots"></i>

                <span>
                    日常用語
                </span>

            </a>


            <a
                href="survival.html"
                class="nav-item">

                <i class="fa-solid fa-suitcase"></i>

                <span>
                    生活必備
                </span>

            </a>


            <a
                href="listening.html"
                class="nav-item">

                <i class="fa-solid fa-headphones"></i>

                <span>
                    聽力練習
                </span>

            </a>


            <a
                href="about.html"
                class="nav-item">

                <i class="fa-solid fa-circle-info"></i>

                <span>
                    關於這裡
                </span>

            </a>

        </nav>


        <div class="sidebar-message">

            <div class="emoji">
                🧊🍵
            </div>

            <p>
                不用急，慢慢學就好。
            </p>

        </div>

    </aside>



    <!-- =========================================
         OVERLAY
    ========================================== -->

    <div
        class="overlay"
        id="overlay">
    </div>



    <!-- =========================================
         MAIN
    ========================================== -->

    <main class="main">

        <div class="content">

            <!--
                這裡保持空白。

                其他 HTML 頁面的內容
                會放進 #page-content。
            -->

            <div id="page-content"></div>

        </div>

    </main>



    <!-- =========================================
         TEMPLATE SCRIPT
    ========================================== -->

    <script>

        const menuButton =
            document.getElementById("menuButton");

        const sidebar =
            document.getElementById("sidebar");

        const overlay =
            document.getElementById("overlay");


        /* 開啟 / 關閉選單 */

        menuButton.addEventListener("click", function () {

            const isOpen =
                sidebar.classList.toggle("open");

            overlay.classList.toggle(
                "show",
                isOpen
            );

            menuButton.setAttribute(
                "aria-expanded",
                isOpen
            );

        });


        /* 點背景關閉 */

        overlay.addEventListener(
            "click",
            function () {

                sidebar.classList.remove("open");

                overlay.classList.remove("show");

                menuButton.setAttribute(
                    "aria-expanded",
                    "false"
                );

            }
        );


        /* 點選選單後關閉 */

        document
            .querySelectorAll(".nav-item")
            .forEach(function (item) {

                item.addEventListener(
                    "click",
                    function () {

                        sidebar.classList.remove("open");

                        overlay.classList.remove("show");

                        menuButton.setAttribute(
                            "aria-expanded",
                            "false"
                        );

                    }
                );

            });

    </script>

</body>

</html>
