
<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Es Teh Break｜輕鬆學印尼語</title>

<link rel="icon" type="image/png" href="favicon.png">

    <style>

        /* =====================================
           基本設定
        ===================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --cream: #fff8ef;
            --cream-dark: #f8e6c9;
            --brown: #96634d;
            --brown-dark: #704a35;
            --text: #191919;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Noto Sans TC",
                sans-serif;

            background: var(--cream);
            color: var(--text);
            min-height: 100vh;

            display: flex;
            flex-direction: column;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button {
            font: inherit;
        }


        /* =====================================
           頂部導覽列
        ===================================== */

        .topbar {
            width: 100%;
            min-height: 76px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 6%;

            background: #fffdf9;
            border-bottom: 1px solid #eaded2;

            position: sticky;
            top: 0;
            z-index: 1000;
        }


        /* =====================================
           品牌 LOGO
        ===================================== */

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;

            flex-shrink: 0;
        }

        .brand img {
            width: 45px;
            height: 45px;
            object-fit: contain;
        }

        .brand-name {
            font-size: 19px;
            font-weight: 800;
            color: var(--brown-dark);
        }

        .brand-subtitle {
            margin-top: 3px;
            font-size: 11px;
            color: #a08370;
        }


        /* =====================================
           導覽選單
        ===================================== */

        .nav-links {
            display: flex;
            align-items: center;
            gap: 38px;
        }

        .nav-links a {
            font-size: 15px;
            font-weight: 600;

            transition: color 0.2s ease;
        }

        .nav-links a:hover {
            color: var(--brown);
        }

        .nav-links .nav-cta {
            padding: 11px 22px;

            border-radius: 30px;
            background: var(--brown);
            color: white;
        }

        .nav-links .nav-cta:hover {
            background: var(--brown-dark);
            color: white;
        }


        /* =====================================
           手機選單按鈕
        ===================================== */

        .menu-button {
            display: none;

            width: 42px;
            height: 42px;

            border: none;
            border-radius: 12px;

            background: #fff0df;
            color: var(--brown-dark);

            font-size: 23px;
            cursor: pointer;
        }


        /* =====================================
           空白內容區域
           
           其他 HTML 頁面可以在這裡
           放入自己的內容。
        ===================================== */

        main {
            flex: 1;
            width: 100%;
            min-width: 0;
        }

        #page-content {
            width: 100%;
            min-height: 0;
        }


        /* =====================================
           頁尾
        ===================================== */

        .footer {
            width: 100%;

            padding: 28px 6%;

            background: var(--cream-dark);
            color: var(--brown-dark);

            text-align: center;
        }

        .footer-brand {
            margin-bottom: 8px;

            font-size: 15px;
            font-weight: 700;
        }

        .footer-description {
            margin-bottom: 6px;

            font-size: 13px;
            line-height: 1.8;
        }

        .footer-copyright {
            font-size: 12px;
            line-height: 1.8;
            color: #806553;
        }


        /* =====================================
           平板與手機版
        ===================================== */

        @media (max-width: 850px) {

            .topbar {
                min-height: 68px;
                padding: 0 5%;
            }

            .menu-button {
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .nav-links {
                position: absolute;

                top: 68px;
                left: 0;
                right: 0;

                display: none;
                flex-direction: column;
                align-items: stretch;
                gap: 0;

                padding: 12px 5% 20px;

                background: #fffdf9;
                border-bottom: 1px solid #eaded2;
            }

            .nav-links.open {
                display: flex;
            }

            .nav-links a {
                padding: 14px 10px;
            }

            .nav-links .nav-cta {
                margin-top: 8px;
                text-align: center;
            }
        }


        /* =====================================
           小螢幕
        ===================================== */

        @media (max-width: 480px) {

            .brand img {
                width: 38px;
                height: 38px;
            }

            .brand-name {
                font-size: 17px;
            }

            .brand-subtitle {
                font-size: 10px;
            }

            .footer {
                padding: 24px 5%;
            }

            .footer-description {
                font-size: 12px;
            }
        }


        /* =====================================
           減少動態效果
        ===================================== */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition: none !important;
            }
        }

    </style>

</head>

<body>

    <!-- =====================================
         頂部導覽列
    ===================================== -->

    <header class="topbar">

        <!-- 品牌 LOGO -->

        <a href="index.html" class="brand">

            <img
                src="logo.png"
                alt="Es Teh Break 標誌">

            <div>

                <div class="brand-name">
                    Es Teh Break
                </div>

                <div class="brand-subtitle">
                    輕鬆學印尼語
                </div>

            </div>

        </a>


        <!-- 手機選單按鈕 -->

        <button
            class="menu-button"
            id="menuButton"
            aria-label="開啟選單"
            aria-expanded="false"
            aria-controls="navLinks">

            ☰

        </button>


        <!-- 導覽選單 -->

        <nav class="nav-links" id="navLinks">

            <a href="index.html">
                首頁
            </a>

            <a href="kosakata.html">
                印尼語詞彙
            </a>

            <a href="about.html">
                關於我們
            </a>

            <a href="lessons.html" class="nav-cta">
                開始學印尼語
            </a>

        </nav>

    </header>


    <!-- =====================================
         主要內容區域

         保持空白。
         其他頁面的內容可以放在這裡。
    ===================================== -->

    <main>

        <div id="page-content">

            <!-- 頁面內容放在這裡 -->

        </div>

    </main>


    <!-- =====================================
         頁尾
    ===================================== -->

    <footer class="footer">

        <div class="footer-brand">
            🧊🍵 Es Teh Break
        </div>

        <p class="footer-description">
            輕鬆學印尼語，讓語言成為連結彼此的橋樑。
        </p>

        <p class="footer-copyright">
            © 2026 Es Teh Break. All Rights Reserved.
        </p>

    </footer>


    <!-- =====================================
         手機選單功能
    ===================================== -->

    <script>

        const menuButton =
            document.getElementById("menuButton");

        const navLinks =
            document.getElementById("navLinks");


        // 開啟與關閉選單

        menuButton.addEventListener("click", function () {

            const isOpen =
                navLinks.classList.toggle("open");

            menuButton.setAttribute(
                "aria-expanded",
                String(isOpen)
            );

            menuButton.setAttribute(
                "aria-label",
                isOpen ? "關閉選單" : "開啟選單"
            );

            menuButton.textContent =
                isOpen ? "✕" : "☰";

        });


        // 點選選單後自動關閉

        navLinks.querySelectorAll("a").forEach(function (item) {

            item.addEventListener("click", function () {

                navLinks.classList.remove("open");

                menuButton.setAttribute(
                    "aria-expanded",
                    "false"
                );

                menuButton.setAttribute(
                    "aria-label",
                    "開啟選單"
                );

                menuButton.textContent = "☰";

            });

        });

    </script>

</body>

</html>
