    <script>

        /* =====================================================
           TEXT TO SPEECH
        ===================================================== */

        let currentSpeech = null;

        function playAudio(text, button = null) {

            if (!("speechSynthesis" in window)) {
                alert("這個瀏覽器不支援語音播放功能。");
                return;
            }

            speechSynthesis.cancel();

            document.querySelectorAll(".playing").forEach(element => {
                element.classList.remove("playing");
            });

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = "id-ID";
            utterance.rate = 0.85;
            utterance.pitch = 1;

            currentSpeech = utterance;

            if (button) button.classList.add("playing");

            utterance.onend = () => {
                if (button) button.classList.remove("playing");
                currentSpeech = null;
            };

            utterance.onerror = () => {
                if (button) button.classList.remove("playing");
                currentSpeech = null;
            };

            speechSynthesis.speak(utterance);
        }


        /* =====================================================
           CONVERSATION DATA
        ===================================================== */

        const conversations = [

            /* 1 */
            {
                speakerA: {
                    name: "Penjual",
                    indonesian: "Mau pesen / beli apa?",
                    mandarin: "要點／買什麼？"
                },
                speakerB: {
                    name: "Pembeli",
                    indonesian: "Saya mau pesen nasi goreng satu, sama es teh satu",
                    mandarin: "我要點一份炒飯，和一杯冰茶。"
                },
                explanation: {
                    vocabulary: [
                        { word: "Apa", meaning: "什麼" },
                        { word: "Sama", meaning: "和" },
                        { word: "Es", meaning: "冰" },
                        { word: "Teh", meaning: "茶" }
                    ],
                    phrases: [
                        { phrase: "Mau pesen / beli apa?", explanation: "要點／買什麼？老闆最常說的第一句話。" },
                        { phrase: "Saya mau pesen ...", explanation: "我要點……" }
                    ],
                    usage: ""
                }
            },

            /* 2 */
            {
                speakerA: {
                    name: "Penjual",
                    indonesian: "Mau makan disini atau dibungkus?",
                    mandarin: "要內用還是外帶？"
                },
                speakerB: {
                    name: "Pembeli",
                    indonesian: "Dibungkus",
                    mandarin: "外帶。"
                },
                explanation: {
                    vocabulary: [
                        { word: "Disini", meaning: "這裡" },
                        { word: "Atau", meaning: "還是／或" }
                    ],
                    phrases: [
                        { phrase: "Makan disini", explanation: "內用" },
                        { phrase: "Dibungkus", explanation: "外帶" }
                    ],
                    usage: `
                        <p>
                            「<strong>Makan di sini</strong>」從字面上來看，就是「在這裡吃」，也就是 <strong>內用</strong>。
                        </p>
                        <p>
                            「<strong>Dibungkus</strong>」從字面上來看，就是「把食物包起來帶走、帶回家」，換句話說就是 <strong>外帶</strong>。
                        </p>
                    `
                }
            },

            /* 3 */
            {
                speakerA: {
                    name: "Penjual",
                    indonesian: "Nasi goreng nya pedes gak?",
                    mandarin: "炒飯要辣嗎？"
                },
                speakerB: {
                    name: "Pembeli",
                    indonesian: "Pedes dikit",
                    mandarin: "一點點辣。"
                },
                explanation: {
                    vocabulary: [
                        { word: "Pedes", meaning: "辣" },
                        { word: "Dikit", meaning: "少" }
                    ],
                    phrases: [],
                    usage: `
                        <h4>🌶️ 印尼的辣度</h4>
                        <p>在印尼餐廳點餐時，可以用以下說法表示自己想要的辣度：</p>
                        <ul>
                            <li><strong>Gak pedes</strong> = 不辣<br>→ 完全不想吃辣。</li>
                            <li><strong>Pedes dikit</strong> = 一點點辣<br>→ 可以吃一點辣，但不要太辣。</li>
                            <li><strong>Pedes</strong> = 辣<br>→ 正常的辣度。</li>
                        </ul>
                        <p>📌 <strong>Pedes</strong> 是 <strong>pedas</strong> 的口語說法，意思都是「辣」。</p>
                        <p>所以如果你不太能吃辣，可以跟店員說：</p>
                        <div class="example-box">
                            <strong>Gak pedes, ya.</strong><br>
                            不要辣喔。
                        </div>
                    `
                }
            },

            /* 4 */
            {
                speakerA: {
                    name: "Penjual",
                    indonesian: "Es teh nya manis atau tawar?",
                    mandarin: "冰茶要甜的還是無糖？"
                },
                speakerB: {
                    name: "Pembeli",
                    indonesian: "Tawar",
                    mandarin: "無糖。"
                },
                explanation: {
                    vocabulary: [
                        { word: "Manis", meaning: "甜" },
                        { word: "Tawar", meaning: "無糖" }
                    ],
                    phrases: [],
                    usage: `
                        <h4>🇮🇩 印尼飲料的甜度與冰量</h4>
                        <p>在印尼，飲料的「甜度」通常可以分成 3 種程度：</p>
                        <ul>
                            <li><strong>Manis</strong> = 甜（有加糖，而且比較甜）</li>
                            <li><strong>Sedeng</strong> = 半糖／正常甜度（甜度適中，不會太甜）</li>
                            <li><strong>Tawar / Jangan pakai gula</strong> = 無糖／不加糖</li>
                        </ul>

                        <p>這裡可以記：</p>
                        <ul>
                            <li><strong>Jangan</strong> = 不要</li>
                            <li><strong>Pakai</strong> = 使用／加</li>
                            <li><strong>Gula</strong> = 糖</li>
                        </ul>
                        <p>
                            所以：<br>
                            <strong>Jangan pakai gula</strong> = 不要加糖<br>
                            <strong>Pakai gula</strong> = 加糖／使用糖
                        </p>

                        <h4>🧊 冰量</h4>
                        <p>冰量也可以簡單分成：</p>
                        <ul>
                            <li><strong>Pakai es</strong> = 加冰／有冰</li>
                            <li><strong>Tidak pakai es</strong> = 不加冰／去冰</li>
                        </ul>
                        <p>其中：</p>
                        <ul>
                            <li><strong>Pakai</strong> = 加、使用</li>
                            <li><strong>Tidak pakai</strong> = 不加、不使用</li>
                            <li><strong>Es</strong> = 冰</li>
                        </ul>

                        <p>所以在印尼點飲料時，可以說：</p>
                        <div class="example-box">
                            <strong>Es teh manis</strong> = 甜冰茶<br>
                            <strong>Es teh sedeng</strong> = 半糖冰茶<br>
                            <strong>Es teh tawar</strong> = 無糖冰茶<br>
                            <strong>Es teh manis, tidak pakai es</strong> = 甜茶，不加冰
                        </div>
                    `
                }
            },

            /* 5 */

        /* =====================================================

        ===================================================== */

        const sentenceGames = [

            {

        /* =====================================================
           SHUFFLE
        ===================================================== */

        function shuffle(array) {

            const result = [...array];

            for (let i = result.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [result[i], result[j]] = [result[j], result[i]];
            }

            return result;
        }


        /* =====================================================
           CONVERSATION
        ===================================================== */

        let currentConversationIndex = 0;

        function renderConversation() {

            const container = document.getElementById("conversation-container");
            if (!container) return;

            const conversation = conversations[currentConversationIndex];
            const total = conversations.length;

            container.innerHTML = `

                <div class="conversation-counter">
                    對話 ${currentConversationIndex + 1} / ${total}
                </div>

                ${renderSpeaker(conversation.speakerA)}

                <div class="dialogue-divider"></div>

                ${renderSpeaker(conversation.speakerB)}

                <div class="conversation-actions">

                    <button class="conversation-action-btn explanation-btn" id="explanation-toggle" type="button">
                        📖 說明
                    </button>

                    <button class="conversation-action-btn next-btn" id="next-conversation" type="button">
                        ${currentConversationIndex === total - 1 ? "✓ 完成" : "→ 下一段"}
                    </button>

                </div>

                <div class="explanation-panel" id="explanation-panel">
                    ${renderExplanation(conversation.explanation)}
                </div>

            `;

            container.querySelectorAll(".audio-btn").forEach(button => {
                button.addEventListener("click", () => {
                    playAudio(button.dataset.text, button);
                });
            });

            const explanationButton = document.getElementById("explanation-toggle");
            const explanationPanel = document.getElementById("explanation-panel");

            explanationButton.addEventListener("click", () => {
                const isOpen = explanationPanel.classList.toggle("show");
                explanationButton.textContent = isOpen ? "📖 關閉說明" : "📖 說明";
            });

            const nextButton = document.getElementById("next-conversation");

            nextButton.addEventListener("click", () => {

                if (currentConversationIndex < total - 1) {
                    currentConversationIndex++;
                    renderConversation();
                } else {
                    nextButton.textContent = "✓ 已完成";
                    nextButton.disabled = true;
                }

            });
        }


        function renderSpeaker(speaker) {

            /* 動作（沒有印尼語，只有中文） */
            if (speaker.action) {

                return `
                    <div class="speaker-row">
                        <div class="speaker-name">${speaker.name}</div>
                        <div class="speaker-content">
                            <div class="action-text">${speaker.action}</div>
                        </div>
                    </div>
                `;

            }

            return `

                <div class="speaker-row">

                    <div class="speaker-name">${speaker.name}</div>

                    <div class="speaker-content">

                        <div class="indonesian-row">

                            <div class="indonesian-text">${speaker.indonesian}</div>

                            <button
                                class="audio-btn"
                                type="button"
                                aria-label="播放印尼語"
                                data-text="${escapeHtml(speaker.indonesian)}">
                                🔊
                            </button>

                        </div>

                        <div class="mandarin-text">${speaker.mandarin}</div>

                    </div>

                </div>

            `;
        }


        function renderExplanation(explanation) {

            let html = "";

            if (explanation.vocabulary && explanation.vocabulary.length > 0) {

                html += `
                    <div class="explanation-section">
                        <h3>📚 生詞</h3>
                        <ul class="explanation-list">
                            ${explanation.vocabulary.map(item => `
                                <li><strong>${item.word}</strong> ＝ ${item.meaning}</li>
                            `).join("")}
                        </ul>
                    </div>
                `;

            }

            if (explanation.phrases && explanation.phrases.length > 0) {

                html += `
                    <div class="explanation-section">
                        <h3>💬 短語</h3>
                        <ul class="explanation-list">
                            ${explanation.phrases.map(item => `
                                <li><strong>${item.phrase}</strong> ＝ ${item.explanation}</li>
                            `).join("")}
                        </ul>
                    </div>
                `;

            }

            if (explanation.usage) {

                html += `
                    <div class="explanation-section">
                        <h3>📝 說明</h3>
                        <div class="explanation-note">
                            ${explanation.usage}
                        </div>
                    </div>
                `;

            }

            return html;
        }


        /* =====================================================
           GAME
        ===================================================== */

        let gameQuestions = [];
        let currentGameIndex = 0;
        let currentTokens = [];
        let selectedWords = [];
        let gameLocked = false;

        function startSentenceGame() {

            gameQuestions = shuffle(sentenceGames);
            currentGameIndex = 0;
            selectedWords = [];
            currentTokens = [];
            gameLocked = false;

            renderSentenceGame();
        }


        function renderSentenceGame() {

            const container = document.getElementById("sentence-game-container");
            if (!container) return;

            /* ALL FINISHED */
            if (currentGameIndex >= gameQuestions.length) {

                container.innerHTML = `
                    <div class="game-finished">
                        <div class="game-finished-icon">🎉</div>
                        <h3>全部完成！</h3>
                        <p>你已完成全部 ${gameQuestions.length} 題。</p>
                        <button class="game-restart-btn" id="restart-game" type="button">
                            🔄 再玩一次
                        </button>
                    </div>
                `;

                document.getElementById("restart-game").addEventListener("click", startSentenceGame);
                return;
            }

            gameLocked = false;

            const question = gameQuestions[currentGameIndex];

            const tokens = question.sentence.map((word, index) => ({
                id: index,
                word: word
            }));

            currentTokens = shuffle(tokens);

            let attempts = 0;

            while (
                currentTokens.every((token, index) => token.id === index) &&
                currentTokens.length > 1 &&
                attempts < 20
            ) {
                currentTokens = shuffle(tokens);
                attempts++;
            }

            selectedWords = [];

            const progress = ((currentGameIndex + 1) / gameQuestions.length) * 100;

            container.innerHTML = `

                <div class="game-progress">
                    <div class="progress-text">
                        第 ${currentGameIndex + 1} 題 / 共 ${gameQuestions.length} 題
                    </div>
                </div>

                <div class="progress-bar">
                    <div class="progress-fill" style="width:${progress}%"></div>
                </div>

                <div class="game-instruction">
                    💡 點擊單字會播放印尼語發音，再依照正確順序組成句子。
                </div>

                <div class="game-question">請把下面的中文翻成印尼語：</div>

                <div class="target-sentence">${question.translation}</div>

                <div class="word-area-title">單字：</div>

                <div class="word-chips" id="available-words"></div>

                <div class="answer-area">

                    <div class="word-area-title">你的答案：</div>

                    <div class="answer-box" id="answer-box">
                        <span class="empty-answer">請點擊上面的單字……</span>
                    </div>

                </div>

                <div class="game-actions">
                    <button class="check-btn" id="check-answer" type="button">✓ 檢查答案</button>
                    <button class="reset-btn" id="reset-answer" type="button">↩ 重來</button>
                </div>

                <div class="game-feedback" id="game-feedback"></div>

            `;

            renderAvailableWords();

            document.getElementById("check-answer").addEventListener("click", checkSentenceAnswer);
            document.getElementById("reset-answer").addEventListener("click", resetSentenceAnswer);
        }


        function renderAvailableWords() {

            const container = document.getElementById("available-words");
            if (!container) return;

            container.innerHTML = "";

            currentTokens.forEach(token => {

                const isSelected = selectedWords.some(selected => selected.id === token.id);

                const button = document.createElement("button");
                button.type = "button";
                button.className = "word-chip";
                button.textContent = token.word;
                button.disabled = isSelected;

                button.addEventListener("click", () => {

                    if (gameLocked) return;

                    playAudio(token.word, button);
                    selectWord(token);

                });

                container.appendChild(button);

            });
        }


        function selectWord(token) {

            if (gameLocked) return;

            const alreadySelected = selectedWords.some(selected => selected.id === token.id);
            if (alreadySelected) return;

            selectedWords.push(token);

            renderAnswer();
            renderAvailableWords();
            clearFeedback();
        }


        function renderAnswer() {

            const answerBox = document.getElementById("answer-box");
            if (!answerBox) return;

            answerBox.innerHTML = "";

            if (selectedWords.length === 0) {
                answerBox.innerHTML = `<span class="empty-answer">請點擊上面的單字……</span>`;
                return;
            }

            selectedWords.forEach((token, index) => {

                const button = document.createElement("button");
                button.type = "button";
                button.className = "answer-chip";
                button.textContent = token.word;
                button.title = "點擊移除此單字";

                button.addEventListener("click", () => {

                    if (gameLocked) return;

                    playAudio(token.word, button);
                    removeSelectedWord(index);

                });

                answerBox.appendChild(button);

            });
        }


        function removeSelectedWord(index) {

            if (gameLocked) return;

            selectedWords.splice(index, 1);

            renderAnswer();
            renderAvailableWords();
            clearFeedback();
        }


        function resetSentenceAnswer() {

            if (gameLocked) return;

            selectedWords = [];

            renderAnswer();
            renderAvailableWords();
            clearFeedback();
        }


        function checkSentenceAnswer() {

            if (gameLocked) return;

            const question = gameQuestions[currentGameIndex];
            const userAnswer = selectedWords.map(token => token.word);
            const correctAnswer = question.sentence;

            const isCorrect =
                userAnswer.length === correctAnswer.length &&
                userAnswer.every((word, index) => word === correctAnswer[index]);

            const answerBox = document.getElementById("answer-box");
            const feedback = document.getElementById("game-feedback");

            if (isCorrect) {

                gameLocked = true;

                answerBox.classList.remove("incorrect");
                answerBox.classList.add("correct");

                feedback.className = "game-feedback show correct";

                feedback.innerHTML = `
                    🎉 答對了！
                    <div class="correct-sentence">${correctAnswer.join(" ")}</div>
                    <div>${question.translation}</div>
                `;

                setTimeout(() => {
                    playAudio(correctAnswer.join(" "));
                }, 100);

                setTimeout(() => {
                    currentGameIndex++;
                    renderSentenceGame();
                }, 2200);

                return;
            }

            answerBox.classList.remove("correct");
            answerBox.classList.add("incorrect");

            feedback.className = "game-feedback show incorrect";

            feedback.innerHTML = `
                ❌ 還不對喔。<br>
                再試試看單字的順序！
            `;
        }


        function clearFeedback() {

            const feedback = document.getElementById("game-feedback");
            const answerBox = document.getElementById("answer-box");

            if (feedback) {
                feedback.className = "game-feedback";
                feedback.innerHTML = "";
            }

            if (answerBox) {
                answerBox.classList.remove("correct", "incorrect");
            }
        }


        /* =====================================================
           VOCAB CARDS
        ===================================================== */

        function renderVocab() {

            const container = document.getElementById("vocab-container");
            if (!container) return;

            container.innerHTML = vocabGroups.map(group => `

                <div class="vocab-group">

                    <div class="vocab-group-title">${group.title}</div>

                    <div class="vocab-grid">

                        ${group.items.map(item => `
                            <button
                                class="vocab-card"
                                type="button"
                                data-text="${escapeHtml(item.word)}">

                                <div class="vocab-emoji">${item.emoji}</div>
                                <div class="vocab-word">${item.word}</div>
                                <div class="vocab-meaning">${item.meaning}</div>

                            </button>
                        `).join("")}

                    </div>

                </div>

            `).join("");

            container.querySelectorAll(".vocab-card").forEach(card => {
                card.addEventListener("click", () => {
                    playAudio(card.dataset.text, card);
                });
            });
        }


        /* =====================================================
           ESCAPE HTML
        ===================================================== */

        function escapeHtml(value) {

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");
        }


        /* =====================================================
           INITIALIZE
        ===================================================== */

        document.addEventListener("DOMContentLoaded", () => {

            renderConversation();
            startSentenceGame();
            renderVocab();

        });

    </script>
