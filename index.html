<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Es Teh Break｜輕鬆學印尼文</title>

    <meta
        name="description"
        content="Es Teh Break 是一個以日常生活口語為主的印尼文學習網站。"
    >
</head>

<body>

    <!-- 共用模板 -->
    <div id="app"></div>


    <!-- 首頁內容 -->
    <main class="main">

        <div class="content">

            <section class="intro-card">

                <h1>🧊🍵 歡迎來到 Es Teh Break！</h1>

                <p>
                    這是一個學習印尼文的網站，
                    主要教你日常生活中真的會用到的印尼文。
                    從一開始，我們就以輕鬆、自然的口語為主。
                </p>

                <p>
                    印尼文有比較正式的說法，
                    通常會在學校、正式場合或書面文章中看到。
                    但有些說法如果直接拿來日常聊天，
                    聽起來可能會有點不自然。
                </p>

                <p>
                    所以在 Es Teh Break，
                    我們更注重生活中實際會說的印尼文，
                    讓你學到的不只是「正確的印尼文」，
                    也能慢慢習慣印尼人平常聊天時的說法。
                </p>

                <div class="intro-note">
                    🧊🍵 不用急，慢慢學，從生活中最常用的印尼文開始。
                </div>

            </section>

        </div>

    </main>
