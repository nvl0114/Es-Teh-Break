<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>印尼語詞彙 | Es Teh Break</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #fff8ef;
            color: #5c4033;
            font-family: Arial, "Noto Sans", sans-serif;
        }

        /* =========================
           MAIN CONTENT
        ========================= */

        .vocab-page {
            max-width: 800px;
            margin: 0 auto;
            padding: 35px 20px 60px;
        }

        /* =========================
           HEADER
        ========================= */

        .page-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .page-header h1 {
            margin: 0 0 10px;
            font-size: 30px;
        }

        .page-header p {
            margin: 0;
            color: #8a6a55;
            font-size: 14px;
            line-height: 1.7;
        }

        /* =========================
           SEARCH
        ========================= */

        .search-box {
            position: relative;
            margin-bottom: 18px;
        }

        .search-box i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #b8865c;
            pointer-events: none;
        }

        #searchInput {
            width: 100%;
            padding: 14px 18px 14px 45px;

            border: 2px solid #ead8c6;
            border-radius: 14px;

            background: #ffffff;
            color: #5c4033;

            font-size: 15px;
            outline: none;

            transition: 0.2s;
        }

        #searchInput:focus {
            border-color: #b8865c;
        }

        #searchInput::placeholder {
            color: #b8a294;
        }

        /* =========================
           RESULT COUNT
        ========================= */

        .result-info {
            margin-bottom: 14px;

            color: #927965;
            font-size: 13px;
        }

        /* =========================
           VOCABULARY LIST
        ========================= */

        .vocab-list {
            display: grid;
            gap: 12px;
        }

        .vocab-card {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 15px;

            padding: 18px;

            background: #ffffff;
            border: 1px solid #ead8c6;
            border-radius: 15px;

            transition: 0.2s ease;
        }

        .vocab-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 16px rgba(92, 64, 51, 0.08);
        }

        /* =========================
           WORD
        ========================= */

        .indonesian {
            margin-bottom: 7px;

            font-size: 20px;
            font-weight: 700;
            color: #5c4033;
        }

        .mandarin {
            margin-bottom: 5px;

            color: #7c563c;
            font-size: 19px;
            font-weight: 600;
        }

        .pinyin {
            color: #9a806e;
            font-size: 13px;
        }

        /* =========================
           AUDIO
        ========================= */

        .audio-button {
            align-self: center;

            width: 42px;
            height: 42px;

            border: none;
            border-radius: 50%;

            background: #b8865c;
            color: #ffffff;

            cursor: pointer;

            font-size: 15px;

            transition: 0.2s ease;
        }

        .audio-button:hover {
            background: #9e704b;
            transform: scale(1.05);
        }

        .audio-button:active {
            transform: scale(0.94);
        }

        /* =========================
           NO RESULT
        ========================= */

        .no-result {
            display: none;

            padding: 35px 20px;

            text-align: center;

            background: #ffffff;
            border: 1px solid #ead8c6;
            border-radius: 15px;

            color: #8a6a55;
        }

        .no-result-icon {
            margin-bottom: 10px;
            font-size: 30px;
        }

        .no-result strong {
            font-size: 16px;
        }

        .no-result p {
            margin: 8px 0 0;
            font-size: 13px;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .vocab-page {
                padding: 25px 14px 45px;
            }

            .page-header h1 {
                font-size: 26px;
            }

            .page-header p {
                font-size: 13px;
            }

            .vocab-card {
                padding: 15px;
            }

            .indonesian {
                font-size: 18px;
            }

            .mandarin {
                font-size: 18px;
            }

            .pinyin {
                font-size: 12px;
            }

            .audio-button {
                width: 40px;
                height: 40px;
            }
        }
    </style>
</head>


<body>

    <!-- =========================
         SHARED SIDEBAR / TEMPLATE
    ========================== -->

    <div id="app"></div>


    <!-- =========================
         VOCABULARY CONTENT
    ========================== -->

    <main class="vocab-page">

        <div class="page-header">

            <h1>📚 印尼語詞彙</h1>

            <p>
                學習常用的印尼語詞彙，
                搭配繁體中文解釋與拼音，
                幫助你更輕鬆地學習印尼語。
            </p>

        </div>


        <!-- =========================
             SEARCH
        ========================== -->

        <div class="search-box">

            <i class="fa-solid fa-magnifying-glass"></i>

            <input
                type="text"
                id="searchInput"
                placeholder="搜尋印尼語、中文或拼音..."
                autocomplete="off">

        </div>


        <!-- =========================
             RESULT COUNT
        ========================== -->

        <div class="result-info">

            <span id="resultCount"></span>

        </div>


        <!-- =========================
             VOCABULARY LIST
        ========================== -->

        <div
            id="vocabList"
            class="vocab-list">
        </div>


        <!-- =========================
             NO RESULT
        ========================== -->

        <div
            id="noResult"
            class="no-result">

            <div class="no-result-icon">
                🔍
            </div>

            <strong>找不到相關詞彙</strong>

            <p>
                請試試其他關鍵字。
            </p>

        </div>

    </main>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>

        /* =========================
           VOCABULARY DATA
        ========================== */

        const vocabulary = [

            {
                indonesia: "Hai",
                mandarin: "嗨",
                pinyin: "hāi"
            },

            {
                indonesia: "Halo",
                mandarin: "你好",
                pinyin: "nǐ hǎo"
            },

            {
                indonesia: "Selamat pagi",
                mandarin: "早安",
                pinyin: "zǎo ān"
            },

            {
                indonesia: "Selamat siang",
                mandarin: "午安",
                pinyin: "wǔ ān"
            },

            {
                indonesia: "Selamat sore",
                mandarin: "午安",
                pinyin: "wǔ ān"
            },

            {
                indonesia: "Selamat malam",
                mandarin: "晚安",
                pinyin: "wǎn ān"
            },

            {
                indonesia: "Pagi",
                mandarin: "早上",
                pinyin: "zǎoshàng"
            },

            {
                indonesia: "Siang",
                mandarin: "中午",
                pinyin: "zhōngwǔ"
            },

            {
                indonesia: "Sore",
                mandarin: "下午",
                pinyin: "xiàwǔ"
            },

            {
                indonesia: "Malam",
                mandarin: "晚上",
                pinyin: "wǎnshàng"
            },

            {
                indonesia: "Terima kasih",
                mandarin: "謝謝",
                pinyin: "xièxie"
            },

            {
                indonesia: "Makasih",
                mandarin: "謝謝",
                pinyin: "xièxie"
            },

            {
                indonesia: "Permisi",
                mandarin: "不好意思",
                pinyin: "bù hǎo yìsi"
            },

            {
                indonesia: "Maaf",
                mandarin: "對不起",
                pinyin: "duìbuqǐ"
            },

            {
                indonesia: "Senang bertemu dengan Anda",
                mandarin: "很高興認識你",
                pinyin: "hěn gāoxìng rènshi nǐ"
            },

            {
                indonesia: "Salam kenal",
                mandarin: "很高興認識你",
                pinyin: "hěn gāoxìng rènshi nǐ"
            },

            {
                indonesia: "Apa kabar",
                mandarin: "你好嗎？",
                pinyin: "nǐ hǎo ma?"
            },

            {
                indonesia: "Gimana kabar",
                mandarin: "最近好嗎？",
                pinyin: "zuìjìn hǎo ma?"
            },

            {
                indonesia: "Aku",
                mandarin: "我",
                pinyin: "wǒ"
            },

            {
                indonesia: "Kamu",
                mandarin: "你",
                pinyin: "nǐ"
            },

            {
                indonesia: "Nama",
                mandarin: "名字",
                pinyin: "míngzi"
            },

            {
                indonesia: "Orang",
                mandarin: "人",
                pinyin: "rén"
            },

            {
                indonesia: "Mana",
                mandarin: "哪裡",
                pinyin: "nǎlǐ"
            },

            {
                indonesia: "Adalah",
                mandarin: "是",
                pinyin: "shì"
            },

            {
                indonesia: "Duluan",
                mandarin: "先走",
                pinyin: "xiān zǒu"
            },

            {
                indonesia: "Hati-hati",
                mandarin: "小心",
                pinyin: "xiǎoxīn"
            },

            {
                indonesia: "Dadah",
                mandarin: "掰掰",
                pinyin: "bāi bāi"
            },

            {
                indonesia: "Sampai jumpa",
                mandarin: "再見",
                pinyin: "zàijiàn"
            }

        ];


        /* =========================
           ELEMENTS
        ========================== */

        const searchInput =
            document.getElementById("searchInput");

        const vocabList =
            document.getElementById("vocabList");

        const resultCount =
            document.getElementById("resultCount");

        const noResult =
            document.getElementById("noResult");


        /* =========================
           DISPLAY VOCABULARY
        ========================== */

        function displayVocabulary(list) {

            vocabList.innerHTML = "";

            resultCount.textContent =
                `共 ${list.length} 個詞彙`;


            if (list.length === 0) {

                noResult.style.display = "block";

                return;
            }


            noResult.style.display = "none";


            list.forEach(word => {

                const card =
                    document.createElement("div");

                card.className = "vocab-card";


                card.innerHTML = `

                    <div class="vocab-info">

                        <div class="indonesian">
                            ${word.indonesia}
                        </div>

                        <div class="mandarin">
                            ${word.mandarin}
                        </div>

                        <div class="pinyin">
                            ${word.pinyin}
                        </div>

                    </div>


                    <button
                        class="audio-button"
                        onclick="speakIndonesian(${JSON.stringify(word.indonesia)})"
                        aria-label="播放 ${word.indonesia}">

                        <i class="fa-solid fa-volume-high"></i>

                    </button>

                `;


                vocabList.appendChild(card);

            });

        }


        /* =========================
           SEARCH
        ========================== */

        function searchVocabulary() {

            const keyword =
                searchInput.value
                    .toLowerCase()
                    .trim();


            if (keyword === "") {

                displayVocabulary(vocabulary);

                return;
            }


            const filtered =
                vocabulary.filter(word => {

                    return (

                        word.indonesia
                            .toLowerCase()
                            .includes(keyword)

                        ||

                        word.mandarin
                            .toLowerCase()
                            .includes(keyword)

                        ||

                        word.pinyin
                            .toLowerCase()
                            .includes(keyword)

                    );

                });


            displayVocabulary(filtered);

        }


        searchInput.addEventListener(
            "input",
            searchVocabulary
        );


        /* =========================
           INDONESIAN AUDIO
        ========================== */

        function speakIndonesian(text) {

            if (!("speechSynthesis" in window)) {

                alert(
                    "你的瀏覽器不支援語音功能。"
                );

                return;
            }


            window.speechSynthesis.cancel();


            const utterance =
                new SpeechSynthesisUtterance(text);


            utterance.lang = "id-ID";

            utterance.rate = 0.85;

            utterance.pitch = 1;


            window.speechSynthesis.speak(
                utterance
            );

        }


        /* =========================
           INITIAL DISPLAY
        ========================== */

        displayVocabulary(vocabulary);

    </script>


    <!-- =========================
         LOAD SHARED TEMPLATE
    ========================== -->

    <script src="script.js"></script>

</body>

</html>
