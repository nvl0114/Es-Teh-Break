<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Es Teh Break｜印尼語常用詞彙</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        :root {
            --cream: #fff8ef;
            --brown: #5c4033;
            --light-brown: #b8865c;
            --soft-brown: #f3e4d3;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--cream);
            color: var(--brown);
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Noto Sans TC",
                "Microsoft JhengHei",
                sans-serif;
            line-height: 1.8;
        }

        .lesson-container {
            max-width: 850px;
            margin: 0 auto;
            padding: 30px 18px 60px;
        }

        .hero {
            background: var(--white);
            border-radius: 22px;
            padding: 28px 24px;
            margin-bottom: 22px;
            box-shadow: 0 5px 18px rgba(92, 64, 51, 0.08);
        }

        .badge {
            display: inline-block;
            background: var(--soft-brown);
            color: var(--brown);
            padding: 5px 12px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 28px;
        }

        p {
            margin: 8px 0;
        }

        .card {
            background: var(--white);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 5px 18px rgba(92, 64, 51, 0.07);
        }

        /* =========================
           SEARCH
        ========================= */

        .search-box {
            position: relative;
            margin-bottom: 18px;
        }

        .search-box i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--light-brown);
            pointer-events: none;
        }

        #searchInput {
            width: 100%;
            padding: 14px 18px 14px 45px;
            border: 2px solid #ead8c5;
            border-radius: 14px;
            background: #fffaf4;
            color: var(--brown);
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        #searchInput:focus {
            border-color: var(--light-brown);
        }

        #searchInput::placeholder {
            color: #b8a294;
        }

        /* =========================
           TABLE
        ========================= */

        table.vocab-table {
            width: 100%;
            border-collapse: collapse;
            border-radius: 14px;
            overflow: hidden;
        }

        .vocab-table thead th {
            background: var(--soft-brown);
            color: var(--brown);
            text-align: left;
            padding: 12px 14px;
            font-size: 14px;
        }

        .vocab-table tbody td {
            padding: 12px 14px;
            border-bottom: 1px solid #f0e2d0;
            font-size: 16px;
            vertical-align: middle;
        }

        .vocab-table tbody tr:last-child td {
            border-bottom: none;
        }

        .vocab-table tbody tr:hover {
            background: #fffaf4;
        }

        .col-id {
            font-weight: 700;
            color: var(--brown);
        }

        .col-zh {
            color: var(--light-brown);
            font-weight: 600;
        }

        .col-audio {
            width: 60px;
            text-align: center;
        }

        /* =========================
           AUDIO BUTTON
        ========================= */

        .audio-button {
            width: 38px;
            height: 38px;
            border: none;
            border-radius: 50%;
            background: var(--light-brown);
            color: #ffffff;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }

        .audio-button:hover {
            background: #9e704b;
            transform: scale(1.05);
        }

        .audio-button:active {
            transform: scale(0.94);
        }

        .audio-button.playing {
            background: #8f6544;
        }

        /* =========================
           NO RESULT
        ========================= */

        .no-result {
            display: none;
            padding: 30px 20px;
            text-align: center;
            color: #8a6a55;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .lesson-container {
                padding: 20px 12px 45px;
            }

            .hero,
            .card {
                padding: 20px 17px;
            }

            h1 {
                font-size: 22px;
            }

            .vocab-table tbody td,
            .vocab-table thead th {
                padding: 10px 8px;
                font-size: 14px;
            }

            .audio-button {
                width: 34px;
                height: 34px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================================================
         JANGAN DIUBAH — wajib ada untuk sidebar/template bersama.
         File ini di ROOT situs, jadi script.js dipanggil tanpa "../"
    ========================================================== -->

    <div id="app"></div>

    <div id="page-source">

        <main class="lesson-container">

            <!-- ============ 導言 ============ -->

            <section class="hero">

                <div class="badge">
                    BAHASA INDONESIA • KOSAKATA
                </div>

                <h1>📚 印尼語常用詞彙</h1>

                <p>
                    這裡整理了日常生活中最常用的印尼語詞彙，
                    每個詞彙都附上繁體中文意思，
                    並提供發音按鈕，讓你可以直接聽到印尼語的實際唸法。
                </p>

                <p>
                    建議搭配聽力多練習幾次，
                    先熟悉聲音，再慢慢記住拼法與意思。
                </p>

            </section>


            <!-- ============ 詞彙表 ============ -->

            <section class="card">

                <div class="search-box">

                    <i class="fa-solid fa-magnifying-glass"></i>

                    <input
                        type="text"
                        id="searchInput"
                        placeholder="搜尋印尼語或中文意思..."
                        autocomplete="off">

                </div>


                <table class="vocab-table">

                    <thead>

                        <tr>

                            <th>印尼語</th>

                            <th>中文意思</th>

                            <th class="col-audio">
                                發音
                            </th>

                        </tr>

                    </thead>

                    <tbody id="vocabBody">
                    </tbody>

                </table>


                <div class="no-result" id="noResult">
                    🔍 找不到相關詞彙，請試試其他關鍵字。
                </div>

            </section>

        </main>

    </div>


    <!-- =========================================================

    ========================================================== -->

            { id: "Adik Perempuan", zh: "妹妹 (正式)" },

            { id: "Kalau .....?", zh: "……呢？" },

            { id: "Diskon", zh: "打折 / 折扣" },
            { id: "Jadi", zh: "所以" },
            { id: "Cuma", zh: "只" },
            { id: "Bayar", zh: "付錢" },
            { id: "Gratis", zh: "免費" },
            { id: "Kalau gitu", zh: "那......" },

            { id: "Tunai / Cash", zh: "現金" },
            { id: "Kartu Kredit", zh: "信用卡" },
            { id: "QRIS", zh: "QRIS 支付" },
            { id: "Kembalian", zh: "找錢" }

        const vocabBody =
            document.getElementById("vocabBody");

        const searchInput =
            document.getElementById("searchInput");

        const noResult =
            document.getElementById("noResult");


        /* =========================================================
           RENDER VOCABULARY
        ========================================================== */

        function renderVocab(list) {

            vocabBody.innerHTML = "";

            if (list.length === 0) {

                noResult.style.display = "block";

                return;
            }

            noResult.style.display = "none";


            list.forEach(word => {

                const row =
                    document.createElement("tr");


                row.innerHTML = `

                    <td class="col-id">
                        ${escapeHTML(word.id)}
                    </td>

                    <td class="col-zh">
                        ${escapeHTML(word.zh)}
                    </td>

                    <td class="col-audio">

                        <button
                            class="audio-button"
                            type="button"
                            aria-label="播放 ${escapeHTML(word.id)}"
                            data-word="${escapeHTML(word.id)}">

                            <i class="fa-solid fa-volume-high"></i>

                        </button>

                    </td>

                `;


                const button =
                    row.querySelector(".audio-button");


                button.addEventListener(
                    "click",
                    function () {

                        speakIndonesian(
                            word.id,
                            button
                        );

                    }
                );


                vocabBody.appendChild(row);

            });

        }


        /* =========================================================
           SEARCH
        ========================================================== */

        function searchVocabulary() {

            const keyword =
                searchInput.value
                    .toLowerCase()
                    .trim();


            if (keyword === "") {

                renderVocab(vocabulary);

                return;
            }


            const filtered =
                vocabulary.filter(word =>

                    word.id
                        .toLowerCase()
                        .includes(keyword)

                    ||

                    word.zh
                        .toLowerCase()
                        .includes(keyword)

                );


            renderVocab(filtered);

        }


        searchInput.addEventListener(
            "input",
            searchVocabulary
        );


        /* =========================================================
           ESCAPE HTML
           防止文字造成 HTML 問題
        ========================================================== */

        function escapeHTML(text) {

            return String(text)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        /* =========================================================
           GET INDONESIAN VOICE
        ========================================================== */

        let availableVoices = [];


        function loadVoices() {

            availableVoices =
                window.speechSynthesis.getVoices();

        }


        if ("speechSynthesis" in window) {

            loadVoices();

            window.speechSynthesis.onvoiceschanged =
                function () {

                    loadVoices();

                };

        }


        /* =========================================================
           SPEAK INDONESIAN
        ========================================================== */

        function speakIndonesian(text, button) {

            if (!("speechSynthesis" in window)) {

                alert(
                    "你的瀏覽器不支援語音功能。"
                );

                return;
            }


            const synth =
                window.speechSynthesis;


            /*
             * Stop previous speech
             */

            synth.cancel();


            /*
             * Refresh voices
             */

            loadVoices();


            /*
             * Find Indonesian voice
             *
             * id
             * id-ID
             * id_ID
             */

            let indonesianVoice =
                availableVoices.find(
                    voice =>
                        voice.lang &&
                        voice.lang
                            .toLowerCase()
                            .startsWith("id")
                );


            /*
             * Create speech
             */

            const utterance =
                new SpeechSynthesisUtterance(text);


            if (indonesianVoice) {

                utterance.voice =
                    indonesianVoice;

                utterance.lang =
                    indonesianVoice.lang;

            } else {

                /*
                 * Fallback
                 */

                utterance.lang =
                    "id-ID";

            }


            utterance.rate = 0.85;

            utterance.pitch = 1;

            utterance.volume = 1;


            /*
             * Button animation
             */

            if (button) {

                button.classList.add("playing");

                const icon =
                    button.querySelector("i");

                if (icon) {

                    icon.className =
                        "fa-solid fa-volume-high";

                }

            }


            /*
             * When speech starts
             */

            utterance.onstart =
                function () {

                    if (button) {

                        button.classList.add(
                            "playing"
                        );

                    }

                };


            /*
             * When speech ends
             */

            utterance.onend =
                function () {

                    if (button) {

                        button.classList.remove(
                            "playing"
                        );

                    }

                };


            /*
             * When speech fails
             */

            utterance.onerror =
                function (event) {

                    console.log(
                        "Speech synthesis error:",
                        event
                    );


                    if (button) {

                        button.classList.remove(
                            "playing"
                        );

                    }

                };


            /*
             * Speak
             */

            synth.speak(utterance);

        }


        /* =========================================================
           INITIAL RENDER
        ========================================================== */

        renderVocab(vocabulary);

    </script>
